# Pipeline del microfrontend "asistencia" (JS + Web Component, sin Angular).
# No instala ni compila nada: publica la carpeta public tal cual.
# Solo corre cuando cambia ESTE repo. El shell no se vuelve a desplegar.
name: Desplegar asistencia

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-asistencia
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el remoto se puede federar
        run: test -f public/remoteEntry.json && test -f public/widget.js && test -f public/lista-alumnos.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
